{% extends 'haapar_unla_app/base.html' %}

{% block title %}Editar Variable - HAAPAR{% endblock %}

{% block content %}
<main class="main">
  <div class="page-title dark-background">
    <div class="container position-relative">
      <h1 class="text-center">Editar Variable</h1>
      <p class="text-center text-muted">ID {{ variable.id_variable }}</p>
    </div>
  </div>

  <section>
    <div class="container d-flex justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card shadow p-4" style="max-width: 600px; margin: auto;">
          <div class="card-body">
            <form method="POST">
              {% csrf_token %}

              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" value="{{ variable.nombre }}" required>
              </div>

              <div class="mb-3">
                <label for="nombre_corto" class="form-label">Nombre Corto</label>
                <input type="text" class="form-control" id="nombre_corto" name="nombre_corto" value="{{ variable.nombre_corto }}" required>
              </div>

              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="4" required>{{ variable.descripcion }}</textarea>
              </div>

              <div class="mb-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select class="form-select" id="tipo" name="tipo" required>
                  <option value="I" {% if variable.tipo == "I" %}selected{% endif %}>Interna</option>
                  <option value="E" {% if variable.tipo == "E" %}selected{% endif %}>Externa</option>
                </select>
              </div>

              <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary me-2">Actualizar</button>
                <a href="{% url 'variable_detalle' %}" class="btn btn-secondary">Cancelar</a>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
{% endblock %}
