{% extends 'haapar_unla_app/base.html' %}
{% block title %}Crear Reporte{% endblock %}

{% block content %}
<!-- FORMULARIO CREAR REPORTES -->
<div class="report-section p-2 mt-2 bg-white rounded">
  <section class="report-section">
    <!-- Encabezado -->

    <h3 class="text-center heading-section">Crear Reportes</h3>
    <p class="text-center text-muted">Ingrese la información necesaria para realizar el reporte.</p>
    <!-- Formulario -->
    <form class="styled-form" method="POST" action="{% url 'crear_reporte' %}">
      {% csrf_token %}

      <!-- Nombre del Tema de interés-->
      <div class="mb-4">
        <label for="tema" class="form-label">Nombre del Tema</label>
        <input type="text" class="form-control" id="nombre" name="nombre" required
          placeholder="Ingresar nombre representativo del Tema de interés">
      </div>

      <!-- Descripción del tema -->
      <div class="mb-4">
        <label for="tema" class="form-label">Descripción del Tema</label>
        <input type="text" class="form-control" id="descripcion" name="descripcion" required rows="3"
          placeholder="Describí brevemente el tema que querés explorar (mínimo 10 caracteres)">
      </div>

      <!-- Año -->
      <div class="mb-4">
        <label for="anio" class="form-label">Año de Estudio</label>
        <input type="number" class="form-control" id="horizonte" name="horizonte" required 
               placeholder="¿Hasta qué año querés proyectar?" min="2023" max="2100"> <!-- Cambiar numeros fijos -->
      </div>

      <!-- Ubicación -->
      <div class="mb-4">
        <label for="ubicacion" class="form-label">Ubicación</label>
        <input type="text" class="form-control" id="territorio" name="territorio" required 
               placeholder="Lugar de interés (ej: Buenos Aires, Argentina)"> 
      </div>

      <!-- Grado de investigación -->
      <div class="mb-4">
        <label class="form-label">Grado de Investigación</label>
        <div class="radio-group d-flex gap-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="grado" id="bajo" value="bajo" required>
            <label class="form-check-label" for="bajo">Bajo</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="grado" id="estandar" value="estandar" required checked>
            <label class="form-check-label" for="estandar">Estándar</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="grado" id="profundo" value="profundo" required>
            <label class="form-check-label" for="profundo">Profundo</label>
          </div>
        </div>
      </div>
      <!-- Botón de envío -->
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-file-circle-plus me-2"></i> Crear proyecto
      </button>
    </form>
  </section>
</div>

<!-- Script de toggle -->
<script>
  function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    sidebar.classList.toggle('collapsed');
  }
</script>
{% endblock %}
