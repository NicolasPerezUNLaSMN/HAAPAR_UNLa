{% extends 'haapar_unla_app/base.html' %} 
{% block title %} Crear Actor - HAAPAR {% endblock %} 
{% block content %}

<main class="main">
  <div class="page-title dark-background">
    <div class="container position-relative">
      <h1 class="text-center heading-section">Crear Nuevo Actor</h1>
      <p class="text-center text-muted">{{ subsistema.nombre }}</p>
    </div>
  </div>

  <section>

            <form method="post" action="{% url 'crear_actor' subsistema.id_subsistema %}" class="styled-form">

    <div class="container d-flex justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card shadow p-4" style="max-width: 600px; margin: auto;">
          <div class="card-body">
            <form method="post" action="{% url 'crear_actor' subsistema.id_subsistema %}">

              {% csrf_token %}
              
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del Actor</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
              </div>
              
              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required></textarea>
              </div>
              
              <div class="mb-3">
                <label for="puesto" class="form-label">Puesto/Rol</label>
                <input type="text" class="form-control" id="puesto" name="puesto" required>
              </div>
              
              <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-success me-2">Guardar</button>
                <a href="{% url 'actor_detalle' subsistema.id_subsistema %}" class="btn btn-secondary">Cancelar</a>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>

  </section>
</main>

{% endblock %}
