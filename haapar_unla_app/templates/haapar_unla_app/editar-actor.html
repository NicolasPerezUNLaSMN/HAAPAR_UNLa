{% extends 'haapar_unla_app/base.html' %}

{% block title %}Editar Actor - HAAPAR{% endblock %}

{% block content %}

<main class="main">

  <!-- ================= HEADER ================= -->

  <div class="page-title dark-background">

    <div class="container position-relative">

      <a href="{% url 'actor-detalle' actor.subsistema.id_subsistema %}"
        class="btn-back">

        <i class="fa-solid fa-arrow-left"></i>

      </a>

      <h1 class="text-center heading-section mb-2">
        Editar Actor
      </h1>

      <p class="text-center mb-0">

        {{ actor.subsistema.sistema.tema.nombre }}

        <span class="mx-2">·</span>

        {{ actor.subsistema.nombre }}

        <span class="mx-2">·</span>

        <strong>{{ actor.nombre }}</strong>

      </p>

    </div>

  </div>


  <!-- ================= FORMULARIO ================= -->

  <section class="py-4">

    <div class="container">

      <div class="row justify-content-center">

        <div class="col-lg-8 col-xl-7">

          <div class="card bg-light border border-success shadow-sm rounded-3">

            <div class="card-header bg-transparent border-bottom">

              <h5 class="mb-0">
                Información del Actor
              </h5>

            </div>


            <div class="card-body p-4">

              <form method="post">

                {% csrf_token %}


                <!-- NOMBRE -->

                <div class="mb-3">

                  <label
                    for="nombre"
                    class="form-label">

                    Nombre del Actor

                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    name="nombre"
                    value="{{ actor.nombre }}"
                    required>

                </div>


                <!-- DESCRIPCIÓN -->

                <div class="mb-3">

                  <label
                    for="descripcion"
                    class="form-label">

                    Descripción

                  </label>

                  <textarea
                    class="form-control"
                    id="descripcion"
                    name="descripcion"
                    rows="4"
                    required>{{ actor.descripcion }}</textarea>

                </div>


                <!-- PUESTO -->

                <div class="mb-4">

                  <label
                    for="puesto"
                    class="form-label">

                    Puesto/Rol

                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="puesto"
                    name="puesto"
                    value="{{ actor.puesto }}"
                    required>

                </div>


                <!-- BOTONES -->

                <div class="d-flex justify-content-center gap-2 flex-wrap">

                  <a
                    href="{% url 'actor-detalle' actor.subsistema.id_subsistema %}"
                    class="btn btn-outline-secondary">

                    <i class="fa-solid fa-xmark me-1"></i>
                    Cancelar

                  </a>


                  <button
                    type="submit"
                    class="btn btn-success">

                    <i class="fa-solid fa-floppy-disk me-1"></i>
                    Guardar Cambios

                  </button>

                </div>

              </form>

            </div>

          </div>

        </div>

      </div>

    </div>

  </section>

</main>

{% endblock %}
