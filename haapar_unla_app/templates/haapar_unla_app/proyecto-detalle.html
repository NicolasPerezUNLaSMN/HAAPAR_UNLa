{% extends 'haapar_unla_app/base.html' %}

{% block title %}
Panel del Subsistema - HAAPAR
{% endblock %}

{% block content %}

<main class="main">

  <!-- ============================= -->
  <!-- ENCABEZADO -->
  <!-- ============================= -->
  <div class="page-title dark-background">

    <div class="container position-relative">

      <a href="{% url 'subsistemas' tema.id_tema %}"
        class="btn-back"
        title="Volver a los subsistemas">

        <i class="fa-solid fa-arrow-left"></i>

      </a>

      <h1 class="text-center heading-section">
        Panel del Subsistema
      </h1>

      {% if subsistema %}
        <p class="text-center mb-0">
          {{ tema.nombre }}
          <span class="mx-2">·</span>
          <strong>{{ subsistema.nombre }}</strong>
        </p>
      {% endif %}

    </div>

  </div>


  <!-- ============================= -->
  <!-- MÓDULOS DEL SUBSISTEMA -->
  <!-- ============================= -->
  <section class="py-4">

    <div class="container">

      <div class="row gy-4">


        <!-- VARIABLES -->
        <div class="col-lg-3 col-md-6">

          <div class="card h-100 bg-light border border-success shadow-sm rounded-3">

            <div class="card-body text-center d-flex flex-column justify-content-center p-4">

              <div class="mb-3">
                <i class="fa-solid fa-chart-line fa-2x text-success"></i>
              </div>

              <h3 class="card-title fs-5 mb-0">

                <a href="{% url 'variable-detalle' subsistema.id_subsistema %}"
                  class="stretched-link text-decoration-none text-success">

                  Variables

                </a>

              </h3>

            </div>

          </div>

        </div>


        <!-- TENDENCIAS -->
        <div class="col-lg-3 col-md-6">

          <div class="card h-100 bg-light border border-success shadow-sm rounded-3">

            <div class="card-body text-center d-flex flex-column justify-content-center p-4">

              <div class="mb-3">
                <i class="fa-solid fa-arrow-trend-up fa-2x text-success"></i>
              </div>

              <h3 class="card-title fs-5 mb-0">

                <a href="{% url 'tendencia-detalle' subsistema.id_subsistema %}"
                  class="stretched-link text-decoration-none text-success">

                  Tendencias

                </a>

              </h3>

            </div>

          </div>

        </div>


        <!-- ACTORES -->
        <div class="col-lg-3 col-md-6">

          <div class="card h-100 bg-light border border-success shadow-sm rounded-3">

            <div class="card-body text-center d-flex flex-column justify-content-center p-4">

              <div class="mb-3">
                <i class="fa-solid fa-people-roof fa-2x text-success"></i>
              </div>

              <h3 class="card-title fs-5 mb-0">

                <a href="{% url 'actor-detalle' subsistema.id_subsistema %}"
                  class="stretched-link text-decoration-none text-success">

                  Actores

                </a>

              </h3>

            </div>

          </div>

        </div>


        <!-- FODA -->
        <div class="col-lg-3 col-md-6">

          <div class="card h-100 bg-light border border-success shadow-sm rounded-3">

            <div class="card-body text-center d-flex flex-column justify-content-center p-4">

              <div class="mb-3">
                <i class="fa-solid fa-chart-simple fa-2x text-success"></i>
              </div>

              <h3 class="card-title fs-5 mb-0">

                <a href="{% url 'foda-graficos' subsistema.id_subsistema %}"
                  class="stretched-link text-decoration-none text-success">

                  Análisis Prospectivo

                </a>

              </h3>

            </div>

          </div>

        </div>


      </div>

    </div>

  </section>

</main>

{% endblock %}
