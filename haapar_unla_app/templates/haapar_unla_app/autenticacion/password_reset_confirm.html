{% extends 'haapar_unla_app/base.html' %}
{% block title %}Nueva Contraseña{% endblock %}

{% block content %}
<main class="container mt-3">
  <div class="row">
    <div class="col-md-6 offset-md-3 mt-5">
      <div class="card p-4">
        <h3 class="card-title text-center">Crear nueva contraseña</h3>
        
        {% if messages %}
        <div class="alert alert-info mt-2">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100 mt-3">Cambiar contraseña</button>
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}
