{% extends 'haapar_unla_app/base.html' %}

{% block title %}Crear Tendencia - HAAPAR{% endblock %}

{% block content %}

<main class="main">

  <!-- Encabezado -->
  <div class="page-title dark-background">
    <div class="container position-relative">

      <a href="{% url 'tendencia-detalle' subsistema.id_subsistema %}"
        class="btn-back"
        title="Volver a las tendencias">
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <h1 class="text-center heading-section mb-2">
        Crear Nueva Tendencia
      </h1>

      <p class="text-center mb-0">
        {{ subsistema.nombre }}
      </p>

    </div>
  </div>

  <!-- Formulario -->
  <section class="py-4">
    <div class="container">

      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">

          <div class="card bg-light border border-success shadow-sm rounded-3">
            <div class="card-body p-4">

              <form method="post"
                    action="{% url 'crear-tendencia' subsistema.id_subsistema %}">

                {% csrf_token %}

                <div class="mb-3">
                  <label for="nombre" class="form-label">
                    Nombre
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    name="nombre"
                    required>
                </div>

                <div class="mb-3">
                  <label for="nombre_corto" class="form-label">
                    Nombre corto
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="nombre_corto"
                    name="nombre_corto"
                    required>
                </div>

                <div class="mb-3">
                  <label for="tipo_dato" class="form-label">
                    Tipo de Dato
                  </label>

                  <select
                    class="form-select"
                    id="tipo_dato"
                    name="tipo_dato"
                    required>
                    <option value="Cuantitativa">Cuantitativa</option>
                    <option value="Cualitativa">Cualitativa</option>
                  </select>
                </div>

                <div class="mb-4">
                  <label for="descripcion" class="form-label">
                    Descripción
                  </label>

                  <textarea
                    class="form-control"
                    id="descripcion"
                    name="descripcion"
                    rows="4"
                    required></textarea>
                </div>

                <div class="d-flex justify-content-center gap-2 flex-wrap">

                  <a
                    href="{% url 'tendencia-detalle' subsistema.id_subsistema %}"
                    class="btn btn-outline-secondary">
                    <i class="fa-solid fa-xmark me-1"></i>
                    Cancelar
                  </a>

                  <button
                    type="submit"
                    class="btn btn-success">
                    <i class="fa-solid fa-floppy-disk me-1"></i>
                    Guardar
                  </button>

                </div>

              </form>

            </div>
          </div>

        </div>
      </div>

    </div>
  </section>

</main>

{% endblock %}
