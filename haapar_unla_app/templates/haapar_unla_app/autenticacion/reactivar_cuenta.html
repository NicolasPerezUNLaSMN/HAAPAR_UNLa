{% extends 'haapar_unla_app/base.html' %}
{% block content %}
<div class="container mt-5">
  <h3>Reactivar cuenta: {{ reactivate_user.email }}</h3>
  <p>Completa el formulario para establecer una nueva contraseña. Actualiza nombre y apellido (Opcional).</p>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label>Nombre</label>
      <input type="text" name="first_name" value="{{ reactivate_user.first_name }}" class="form-control">
    </div>
    <div class="mb-3">
      <label>Apellido</label>
      <input type="text" name="last_name" value="{{ reactivate_user.last_name }}" class="form-control">
    </div>
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Reactivar cuenta</button>
  </form>
</div>
{% endblock %}
