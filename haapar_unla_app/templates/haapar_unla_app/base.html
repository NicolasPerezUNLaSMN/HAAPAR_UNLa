{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <!-- METADATOS Y ESTILOS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA HAAPAR</title>

    <!-- Iconos y Frameworks -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <link href="{% static 'haapar_unla_app/assets/css/main.css' %}" rel="stylesheet">

</head>

<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar collapsed d-flex flex-column flex-shrink-0 position-fixed">
            <!-- Botón de colapso -->
            <i class="fa-solid fa-bars toggle-btn"></i>

            <!-- Logo -->
            <div class="p-4">
                <img src="{% static 'haapar_unla_app/assets/img/logo-en-verde-transparente.png' %}" alt="Uces Logo" class="logo-img mb-0">
            </div>

            <!-- Navegación -->
            <div class="nav flex-column">
                <a href="{% url 'inicio' %}" class="sidebar-link active text-decoration-none" data-title="Nuevo Proyecto">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span class="hide-on-collapse">Nuevo Proyecto</span>
                </a>
                <a href="{% url 'listar_proyectos' %}" class="sidebar-link active text-decoration-none proyectos" data-title="Proyectos">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span class="hide-on-collapse">Proyectos</span>
                </a>

                <!-- Dark Mode -->
                <div class="mt-auto p-3">
                    <button id="toggle-theme" class="btn btn-sm btn-outline-secondary w-100">
                        <i class="fa-solid fa-moon"></i> Modo Oscuro
                    </button>
                </div>
            </div>
        </nav>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">
                    <i class="fa-solid fa-brain me-2 text-success"></i> IA HAAPAR
                </h2>
                <!-- Menu de usuario -->
                <div class="user-menu dropdown">
                    <button class="btn icon" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-regular fa-user text-success fs-4"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="{% url 'perfil' %}">Mi perfil</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        {% if user.is_authenticated %}
                          <li><a class="dropdown-item text-danger" href="{% url 'cerrar_sesion' %}">Cerrar Sesion</a></li>
                        {% else %}
                          <li><a class="dropdown-item text-secondary" href="{% url 'registro' %}">Registrarse</a></li>
                          <li><a class="dropdown-item text-success" href="{% url 'iniciar_sesion' %}">Iniciar Sesion</a></li>
                        {% endif %}
                    </ul>
                </div>
            </div>

            <div class="section-divider"></div>
            <div class="container-fluid">
                <!-- Contenido dinámico -->
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'haapar_unla_app/assets/js/main.js' %}"></script>
</body>
</html>
