{% extends 'haapar_unla_app/base.html' %}
{% block title %}Crear Subsistema{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="text-center heading-section">Crear Subsistema para {{ tema.nombre }}</h2>
  <form method="POST" class="styled-form">
    {% csrf_token %}
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" name="nombre" required>
    </div>
    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Crear Subsistema</button>
    <a href="{% url 'subsistemas' tema.id_tema %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
