{% extends 'haapar_unla_app/base.html' %}
{% block title %} Iniciar Sesion {% endblock %}

{% block content %}

<main class="container mt-3">
  <div class="page-title">
    <div class="container position-relative">
      <h3 class="text-center heading-section">Iniciar Sesion</h3>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 offset-md-3 mt-5">
      <form action="/signin/" method="POST" class="styled-form">

        {# Muestra el mensaje de error si existe #}
        {% if error %}
        <p class="alert alert-danger text-danger fw-bold">{{ error }}</p>
        {% endif %}

        {% csrf_token %} {# Esencial para la seguridad en formularios Django #}

        <div class="mb-3">
          <label for="username" class="form-label">Usuario:</label>
          <input type="text" name="username" id="username" class="form-control" placeholder="Usuario" required />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña:</label>
          <input type="password" name="password" id="password" class="form-control" placeholder="Contraseña" required />
        </div>

        <button type="submit" class="btn btn-primary mt-3">
          Iniciar Sesion
        </button>
      </form>
    </div>
  </div>
</main>

{% endblock %}
